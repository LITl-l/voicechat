name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev cmake \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release

      - name: Package binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/vc-cli dist/
          cp target/release/vc-tray dist/
          tar czf voicechat-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist .

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/vc-cli.exe dist/
          cp target/release/vc-tray.exe dist/
          7z a voicechat-${{ github.ref_name }}-windows-x86_64.zip dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicechat-${{ matrix.target }}
          path: voicechat-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            voicechat-*.tar.gz
            voicechat-*.zip
