[workspace]
resolver = "2"
members = ["vc-core", "vc-cli", "vc-tray"]

[workspace.dependencies]
cpal = "0.15"
audiopus = "0.3.0-rc.0"
ringbuf = "0.4"
socket2 = "0.5"
crossbeam-utils = "0.8"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
